name: 定时采集
on:
  schedule:
    - cron: '35 22,10 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: snapshot
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Create JSON and media archive
        id: snapshot
        env:
          BOT_ID: ${{ secrets.BOT_ID }}
        run: go run .
      - name: Publish media archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.snapshot.outputs.tag }}
          ARCHIVE: ${{ steps.snapshot.outputs.archive }}
        run: gh release create "$TAG" "$ARCHIVE" --title "$TAG" --notes '该时刻快照的图片与 MP4 归档。' --target "$GITHUB_SHA" --latest=false
      - name: Commit JSON snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs
          git diff --cached --quiet || git commit -m "Create JSON snapshot"
          git push
